[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ichiran"
dynamic = ["version"]
description = "AI-powered README generator — interview your project, scan your codebase, generate a complete README"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Utkarsh Kamat", email = "work.utkarshkamat@gmail.com" },
    { name = "Hruday", email = "mscids2024.hruday@unigoa.ac.in" }
]
keywords = ["readme", "documentation", "ai", "gemini", "cli", "generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "google-genai>=1.67.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "pathspec>=1.0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pip-audit>=2.10.0",
]

[project.scripts]
ichiran = "ichiran.cli:main"

[project.urls]
Homepage = "https://github.com/ushiecodes/ichiran"
Issues = "https://github.com/ushiecodes/ichiran/issues"

[tool.setuptools.dynamic]
version = {attr = "ichiran.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ichiran*"]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "ruff>=0.15.7",
    "twine>=6.2.0",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"tests/__init__.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
